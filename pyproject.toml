[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eureka-vacuum"
version = "0.1.0"
description = "Robot vacuum navigation, RGBD recording, and Qt visualisation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10",
  "pyzmq>=25",
  "PySide6>=6.7",
]

[project.scripts]
eureka = "eureka.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eureka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-plugin-autoload"

[tool.mypy]
files = ["src/eureka"]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "scipy-stubs>=1.15.3.0",
]
