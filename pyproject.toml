[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eureka-vacuum"
version = "0.1.0"
description = "Robot vacuum navigation, RGBD recording, and Qt visualisation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10",
  "pyzmq>=25",
  "PySide6>=6.7",
]

[project.scripts]
eureka = "eureka.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eureka"]
